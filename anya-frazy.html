<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<title>Разговорник · 微信</title>
<style>
:root{--bg:#ededed;--card:#fff;--ink:#191919;--sub:#7a7a7a;--line:#e5e5e5;--green:#07c160;--green-d:#06ad56;--bubble:#95ec69;--py:#576b95;--star:#fa9d3b;--red:#fa5151}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.zh{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",sans-serif}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid #d9d9d9}
.bar{height:52px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;position:relative;max-width:760px;margin:0 auto}
.bar .back{position:absolute;left:8px;font-size:26px;padding:4px 10px;line-height:1}
.bar .tg{position:absolute;right:8px;display:flex;gap:4px}
.tog{font-size:12px;padding:5px 9px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.tog.on{background:var(--green);border-color:var(--green);color:#fff}
main{max-width:760px;margin:0 auto;padding:10px 12px 96px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:8px 12px;margin:2px 0 10px}
.search input{border:0;outline:0;font:inherit;flex:1;background:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:18px;background:#fff;font-size:14px;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--green);color:#fff}
.sec{font-size:13px;color:var(--sub);margin:14px 4px 6px;display:flex;gap:6px;align-items:baseline}
.sec .zh{font-size:13px}
.card{background:var(--card);border-radius:10px;padding:12px 12px 10px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.card .h{font-size:22px;font-weight:600;line-height:1.3}
.card .p{color:var(--py);font-size:15px}
.card .r{font-size:15px}
.card .n{font-size:13px;color:var(--sub);margin-top:2px}
.card .ans{display:inline-flex;align-items:center;gap:6px;background:#f2f2f2;border-radius:6px;padding:4px 9px;font-size:14px;width:max-content;max-width:100%}
.card .ans b{font-weight:500;color:var(--sub)}
.card{grid-template-columns:1fr auto}
.card>.h,.card>.p,.card>.r,.card>.n{grid-column:1}
.card>.play{grid-column:2;grid-row:1/span 2;align-self:start}
.acts{grid-column:1/-1;display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:4px}
.acts .sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#f2f2f2;flex:none}
.ib.play{width:44px;height:44px;font-size:18px}
.ib.play{background:var(--green);color:#fff}
.ib.fav.on{color:var(--star)}
.ib.mic.rec{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.res{grid-column:1/-1;font-size:14px;margin-top:6px;padding:6px 10px;border-radius:6px}
.res.ok{background:#e6f7ee;color:#067a3f}.res.bad{background:#fff1f0;color:#c0392b}
.hide-py .p,.hide-ru .r,.hide-ru .tr{visibility:hidden}
.hide-ru .card .r{visibility:hidden}
.card.reveal .r,.card.reveal .p{visibility:visible!important}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:#f7f7f7;border-top:1px solid #d9d9d9;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
#tabs .in{display:flex;width:100%;max-width:760px}
#tabs button{flex:1;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:#191919}
#tabs button .i{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.75}
#tabs button.on{color:var(--green)}#tabs button.on .i{filter:none;opacity:1}
/* dialogs */
.dl{background:#fff;border-radius:10px;display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.av{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;font-size:22px;background:#f2f2f2;flex:none}
.dl .t{font-weight:600}.dl .s{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.chat{display:flex;flex-direction:column;gap:14px;padding:6px 0 10px}
.msg{display:flex;gap:9px;align-items:flex-start;max-width:100%}
.msg.me{flex-direction:row-reverse}
.msg .av{width:40px;height:40px;font-size:15px;font-weight:600;color:#fff}
.bub{position:relative;background:#fff;border-radius:6px;padding:9px 12px;max-width:min(78%,520px);cursor:pointer}
.msg.me .bub{background:var(--bubble)}
.bub:before{content:"";position:absolute;top:13px;left:-6px;border:6px solid transparent;border-left:0;border-right-color:#fff}
.msg.me .bub:before{left:auto;right:-6px;border-right:0;border-left:6px solid var(--bubble)}
.bub .h{font-size:19px}.bub .p{font-size:13px;color:var(--py)}.bub .tr{font-size:13px;color:#4a4a4a;margin-top:2px}
.msg.me .bub .p{color:#3b5b1f}
.bub.playing{box-shadow:0 0 0 2px var(--green)}
.who{font-size:12px;color:var(--sub);margin-bottom:2px}.msg.me .who{text-align:right}
#ttl{max-width:calc(100% - 210px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr{display:flex;gap:8px;justify-content:center;position:sticky;bottom:70px;margin-top:8px}
.btn{background:var(--green);color:#fff;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:active{background:var(--green-d)}
.time{align-self:center;font-size:12px;color:#fff;background:#cecece;border-radius:4px;padding:2px 7px}
/* practice */
.pm{background:#fff;border-radius:10px;padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.pm .t{font-weight:600}.pm .s{font-size:13px;color:var(--sub)}
.qbox{background:#fff;border-radius:10px;padding:16px;margin-bottom:10px}
.qtop{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:10px}
.prog{height:4px;background:#e5e5e5;border-radius:2px;margin-bottom:12px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.opts{display:grid;gap:8px}
.opt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 14px;text-align:left;font-size:17px}
.opt.ok{background:#e6f7ee;border-color:var(--green)}.opt.no{background:#fff1f0;border-color:var(--red)}
.big{font-size:30px;font-weight:600;text-align:center;margin:8px 0 2px}
.fb{margin-top:10px;font-size:14px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 20px}
@media (min-width:700px){.card .h{font-size:24px}}
</style></head>
<body>
<div id="top"><div class="bar"><button class="back" id="back" hidden>‹</button><span id="ttl">Разговорник</span>

 <div class="p">${esc(it.py)}</div><div class="r">${esc(it.ru)}</div>${it.n?`<div class="n">${esc(it.n)}</div>`:''}
 <div class="acts">${it.a?`<button class="ans zh" data-a="ans"><b>Ответ:</b> ${esc(it.a)} 🔊</button>`:''}<span class="sp"></span><button class="ib" data-a="slow" aria-label="Медленно">🐢</button><button class="ib mic" data-a="mic" aria-label="Сказать">🎤</button><button class="ib fav ${fav.has(it.zh)?'on':''}" data-a="fav" aria-label="В избранное">${fav.has(it.zh)?'★':'☆'}</button></div>
 <div class="res" hidden></div></div>`}
function bindCards(list){app.querySelectorAll('.card').forEach(c=>{const it=list[+c.dataset.i];
 c.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b){c.classList.toggle('reveal');return}const a=b.dataset.a;
  if(a==='play')play(it.zh,it.zh);else if(a==='slow')play(it.zh,it.zh,.7);else if(a==='ans')play(it.a,it.a);
  else if(a==='fav'){fav.has(it.zh)?fav.delete(it.zh):fav.add(it.zh);LS.set('anya_fav',[...fav]);b.classList.toggle('on');b.textContent=fav.has(it.zh)?'★':'☆'}
  else if(a==='mic'){const o=c.querySelector('.res');o.hidden=false;listen(it.zh,b,o)}})})}
function header(t,back){$('#ttl').textContent=t;$('#back').hidden=!back;$('#back').onclick=back||null;window.scrollTo(0,0)}
// ---- вкладка Фразы ----
function phrases(){header('Разговорник');
 const list=ALL.filter(it=>(cat==='all'||it.cat.id===cat)&&(!q||(it.zh+it.py+it.ru).toLowerCase().includes(q)||it.py.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(q)));
 let html=`<label class="search">🔍<input id="q" placeholder="Поиск: «вичат», «nihao», 你好" value="${esc(q)}"></label>
 <div class="chips"><button class="chip ${cat==='all'?'on':''}" data-c="all">Все · ${ALL.length}</button>${CATS.map(c=>`<button class="chip ${cat===c.id?'on':''}" data-c="${c.id}">${c.emoji} ${c.ru}</button>`).join('')}</div>`;
 let last=null;list.forEach((it,i)=>{if(it.cat!==last){last=it.cat;html+=`<div class="sec">${it.cat.emoji} ${it.cat.ru} <span class="zh">${it.cat.zh}</span></div>`}html+=cardHTML(it,i)});
 if(!list.length)html+='<div class="empty">Ничего не нашлось 🤷‍♀️</div>';
 app.innerHTML=html;bindCards(list);
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;LS.set('anya_cat',cat);phrases()});
 const inp=$('#q');inp.oninput=()=>{q=inp.value.trim().toLowerCase();const pos=inp.selectionStart;phrases();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
// ---- Избранное ----
function favs(){header('Избранное');const list=ALL.filter(it=>fav.has(it.zh));
 app.innerHTML=list.length?`<div class="sec">⭐ Твои фразы · ${list.length}</div>`+list.map(cardHTML).join(''):'<div class="empty">Нажми ☆ на любой фразе — и она появится здесь.<br><br>Удобно собрать свои самые нужные фразы.</div>';bindCards(list)}
// ---- Диалоги ----
const AVC={'安雅':'#07c160','小雨':'#fa9d3b','店员':'#576b95'};
function dialogs(){header('Диалоги');app.innerHTML=DIALOGS.map((d,i)=>`<button class="dl" data-d="${i}"><span class="av">${d.e}</span><span><div class="t">${d.t}</div><div class="s zh">${esc(d.lines[d.lines.length-1][1])}</div></span></button>`).join('');
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>chat(+b.dataset.d))}
function chat(k){const d=DIALOGS[k];header(d.t,dialogs);let stop=false;
 app.innerHTML=`<div class="chat"><div class="time">Нажми на сообщение, чтобы послушать</div>${d.lines.map((l,i)=>`<div class="msg ${ROLES[l[0]].me?'me':''}"><div class="av" style="background:${AVC[l[0]]}">${ROLES[l[0]].ru[0]}</div><div><div class="who">${ROLES[l[0]].ru}</div><div class="bub" data-l="${i}"><div class="h zh">${esc(l[1])}</div><div class="p">${esc(l[2])}</div><div class="tr">${esc(l[3])}</div></div></div></div>`).join('')}</div>
 <div class="ctr"><button class="btn" id="all">▶ Весь диалог</button><button class="btn ghost" id="me">🎭 Я — Аня</button></div>`;
 const bubs=[...app.querySelectorAll('.bub')];const key=l=>l[0]+'|'+l[1];
 const mark=i=>bubs.forEach((b,j)=>b.classList.toggle('playing',j===i));
 bubs.forEach((b,i)=>b.onclick=()=>{stop=true;mark(i);play(key(d.lines[i]),d.lines[i][1],1,()=>mark(-1))});
 $('#all').onclick=()=>{stop=false;let i=0;const go=()=>{if(stop||i>=d.lines.length){mark(-1);return}mark(i);bubs[i].scrollIntoView({block:'center',behavior:'smooth'});play(key(d.lines[i]),d.lines[i][1],1,()=>{i++;setTimeout(go,350)})};go()};
 $('#me').onclick=()=>{stop=false;let i=0;const go=()=>{if(stop||i>=d.lines.length){mark(-1);return}mark(i);bubs[i].scrollIntoView({block:'center',behavior:'smooth'});
   if(ROLES[d.lines[i][0]].me){bubs[i].classList.add('reveal');setTimeout(()=>{i++;go()},Math.max(2500,d.lines[i][1].length*450))}else play(key(d.lines[i]),d.lines[i][1],1,()=>{i++;setTimeout(go,300)})};go()}}
// ---- Тренировка ----
function practice(){header('Тренировка');
 app.innerHTML=`<button class="pm" data-m="reply"><span class="av">💬</span><span><div class="t">Ответь в чате</div><div class="s">Тебе пишут — выбери, что ответить</div></span></button>
 <button class="pm" data-m="mean"><span class="av">🀄</span><span><div class="t">Что это значит?</div><div class="s">Фраза → перевод</div></span></button>
 <button class="pm" data-m="listen"><span class="av">🎧</span><span><div class="t">Послушай и найди</div><div class="s">Звучит фраза — выбери её</div></span></button>
 <button class="pm" data-m="say"><span class="av">🎤</span><span><div class="t">Скажи по-китайски</div><div class="s">Видишь перевод — произнеси фразу, микрофон проверит</div></span></button>`;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>quiz(b.dataset.m))}
function quiz(m){const N=10;let n=0,score=0;
 const pairs=ALL.filter(it=>it.a),pool=m==='reply'?pairs:ALL;const qs=sh(pool).slice(0,N);
 const title={reply:'Ответь в чате',mean:'Что это значит?',listen:'Послушай и найди',say:'Скажи по-китайски'}[m];
 function next(){if(n>=qs.length)return end();const it=qs[n++];header(title,practice);
  let body='',opts=[];
  if(m==='reply'){opts=sh([it.a,...sh([...new Set(pairs.filter(x=>x.cat!==it.cat).map(x=>x.a))].filter(a=>a!==it.a)).slice(0,2)]);
   body=`<div class="msg" style="margin:4px 0 14px"><div class="av" style="background:${AVC['小雨']};color:#fff;font-weight:600">С</div><div class="bub"><div class="h zh">${esc(it.zh)}</div><div class="p">${esc(it.py)}</div><div class="tr">${esc(it.ru)}</div></div></div><div class="fb">Что ответишь?</div>`}
  else if(m==='mean'){opts=sh([it.ru,...sh(ALL.filter(x=>x.ru!==it.ru)).slice(0,3).map(x=>x.ru)]);body=`<div class="big zh">${esc(it.zh)}</div><div class="p" style="text-align:center;color:var(--py)">${esc(it.py)}</div>`}
  else if(m==='listen'){opts=sh([it.zh,...sh(ALL.filter(x=>x.zh!==it.zh&&x.cat===it.cat)).slice(0,3).map(x=>x.zh)]);body=`<div style="text-align:center;margin:10px 0"><button class="btn" id="pl">🔊 Слушать ещё</button></div>`}
  else body=`<div class="big" style="font-size:22px">${esc(it.ru)}</div>${it.n?`<div class="fb" style="text-align:center">${esc(it.n)}</div>`:''}
   <div style="text-align:center;margin:14px 0 4px;display:flex;gap:8px;justify-content:center"><button class="btn" id="rec">🎤 Сказать</button><button class="btn ghost" id="show">Показать</button></div><div class="res" id="out" hidden></div>
   <div id="ansb" hidden><div class="big zh" style="font-size:24px">${esc(it.zh)}</div><div class="p" style="text-align:center;color:var(--py)">${esc(it.py)}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn ghost" id="pl2">🔊</button><button class="btn" id="nx">Дальше ›</button></div></div>`;
  app.innerHTML=`<div class="qbox"><div class="qtop"><span>${n} / ${qs.length}</span><span>Верно: ${score}</span></div><div class="prog"><i style="width:${(n-1)/qs.length*100}%"></i></div>${body}
   ${opts.length?`<div class="opts">${opts.map((o,i)=>`<button class="opt ${m!=='mean'?'zh':''}" data-o="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div>`:''}</div>`;
  if(m==='listen'){$('#pl').onclick=()=>play(it.zh,it.zh);setTimeout(()=>play(it.zh,it.zh),300)}
  if(m==='reply')setTimeout(()=>play(it.zh,it.zh),300);
  if(m==='say'){const o=$('#out');let done=false,t=null;
   const reveal=()=>{if(t)clearInterval(t);$('#ansb').hidden=false;$('#show').hidden=true;play(it.zh,it.zh)};
   $('#rec').onclick=()=>{o.hidden=false;listen(it.zh,$('#rec'),o);if(t)clearInterval(t);t=setInterval(()=>{if(!done&&o.classList.contains('ok')){done=true;score++;reveal()}},300)};
   $('#show').onclick=reveal;$('#pl2').onclick=()=>play(it.zh,it.zh);$('#nx').onclick=()=>{if(t)clearInterval(t);next()}}
  const right=m==='reply'?it.a:m==='mean'?it.ru:it.zh;
  app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.o],ok=o===right;
   app.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(opts[+x.dataset.o]===right)x.classList.add('ok')});if(!ok)b.classList.add('no');if(ok)score++;
   const ansIt=m==='reply'?ALL.find(x=>x.zh===it.a):it;
   $('#fb').innerHTML=(ok?'✅ Верно! ':'❌ Правильно: ')+`<span class="zh">${esc(ansIt?ansIt.zh:right)}</span> ${ansIt?'· '+esc(ansIt.py)+' · '+esc(ansIt.ru):''}<div style="margin-top:10px"><button class="btn" id="nx2">Дальше ›</button></div>`;
   play(m==='reply'?it.a:it.zh,m==='reply'?it.a:it.zh);$('#nx2').onclick=next})}
 function end(){header(title,practice);app.innerHTML=`<div class="qbox" style="text-align:center"><div style="font-size:54px">${score>=8?'🏆':score>=5?'👏':'💪'}</div><div class="big">${score} из ${qs.length}</div><div class="fb">${score>=8?'Супер! Можно смело знакомиться 😎':'Ещё разок — и будет отлично!'}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn" id="ag">Ещё раз</button><button class="btn ghost" id="bk">К тренировкам</button></div></div>`;$('#ag').onclick=()=>quiz(m);$('#bk').onclick=practice}
 next()}
// ---- табы ----
const TABS={ph:phrases,dl:dialogs,pr:practice,fv:favs};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{try{speechSynthesis.cancel()}catch(e){}if(cur){cur.pause();cur=null}document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));TABS[b.dataset.t]()});
phrases();
</script></body></html>
