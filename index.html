*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Verdana,"DejaVu Sans","Segoe UI",sans-serif;font-weight:700;color:var(--cream);background:#1a1410 center/cover no-repeat fixed;min-height:100%;transition:background-image .3s}
body[data-bg=fire]{background-image:var(--bg-fire)}body[data-bg=pond]{background-image:var(--bg-pond)}body[data-bg=cherry]{background-image:var(--bg-cherry)}
body[data-bg=creep]{background-image:var(--bg-creep)}body[data-bg=woodbg]{background-image:var(--bg-woodbg);background-size:228px;background-repeat:repeat;image-rendering:pixelated}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(10,8,6,.25),rgba(10,8,6,.7));pointer-events:none}
.zh{font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;font-weight:700}
#app{position:relative;width:min(1280px,100%);min-height:100vh;margin:0 auto;padding:18px 24px 26px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.tx{border-style:solid;border-width:16px 18px;border-image:var(--stone) 26 28 fill/16px 18px stretch;image-rendering:pixelated;background:none}
.btn{font:inherit;font-family:Pix,Verdana,sans-serif;cursor:pointer;color:#fff;text-shadow:2px 2px 0 #2b2118;font-size:15px;min-height:56px;padding:2px 8px;border-style:solid;border-width:16px 18px;border-image:var(--stone) 26 28 fill/16px 18px stretch;image-rendering:pixelated;background:none;transition:filter .1s,transform .1s}
.btn.g{border-image-source:var(--green)}.btn.w{border-image-source:var(--wood)}.btn.d{border-image-source:var(--dirt)}
.btn:hover:not(:disabled){filter:brightness(1.22)}.btn:active:not(:disabled){transform:translateY(2px)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled{cursor:default}
.btn.sm{font-size:12px;min-height:44px;border-width:12px 14px;border-image-width:12px 14px}
.btn{position:relative;isolation:isolate}.btn.no:after,.btn.sel:after{content:"";position:absolute;inset:-13px -15px;z-index:-1;border-radius:6px;background:rgba(214,40,32,.62)}
.btn.sel:after{background:rgba(52,92,230,.6)}
.btn.ok{border-image-source:var(--green)!important;filter:brightness(1.2) saturate(1.25)}
.btn.miss{outline:4px dashed var(--gold);outline-offset:-10px}
.parch{border-style:solid;border-width:38px 40px;border-image:var(--parch) 58 60 fill/38px 40px stretch;image-rendering:pixelated;color:var(--ink)}
.darkp{background:#2a1f18f2;border:5px solid #7a5232;outline:3px solid #22150c;box-shadow:inset 0 0 0 3px #17100b,0 6px 0 #0006;padding:14px 18px;color:var(--cream)}
.ic{width:56px;height:56px;flex:none;background:center/contain no-repeat;image-rendering:pixelated;filter:drop-shadow(2px 3px 0 #0007)}
.ic.s{width:32px;height:32px}
.hud{display:flex;gap:14px;align-items:center;justify-content:space-between}
.sign{font-family:Pix,Verdana,sans-serif;font-size:16px;padding:0 18px;min-height:52px;display:flex;align-items:center;gap:10px;color:#fff;text-shadow:2px 2px 0 #2b2118;border-style:solid;border-width:14px 18px;border-image:var(--wood) 26 28 fill/14px 18px stretch;image-rendering:pixelated}
.stat{font-family:Pix,Verdana,sans-serif;display:flex;align-items:center;gap:10px;font-size:16px;color:#fff;text-shadow:2px 2px 0 #000}
.hearts{display:flex;gap:3px}.hrt{width:30px;height:27px;background:var(--heart) center/contain no-repeat;image-rendering:pixelated;filter:grayscale(1) brightness(.33)}.hrt.on{filter:drop-shadow(1px 2px 0 #0008)}
.hrt.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.5) rotate(-10deg)}}
/* меню */
.menuwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:stretch}
h1{font-family:Pix,Verdana,sans-serif;font-weight:400;font-size:44px;color:#fff;text-shadow:4px 4px 0 #2b2118,0 0 24px #ffb84a88;letter-spacing:2px;line-height:1}
.sub{font-size:17px;font-weight:400;color:var(--cream);text-shadow:2px 2px 0 #000;margin-top:6px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.card{text-align:left;display:flex;gap:12px;align-items:center;min-height:104px}
.card b{display:block;font-size:14px;line-height:1.35;font-weight:400}.card small{display:block;font-family:Verdana,sans-serif;font-size:13px;font-weight:400;line-height:1.25;margin-top:5px;text-shadow:1px 1px 0 #2b2118}
.player{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.player .head{width:124px;height:124px;background:var(--head) center/contain no-repeat;image-rendering:pixelated}
.player .nm{font-family:Pix,Verdana,sans-serif;font-weight:400;font-size:22px}.player .ln{display:flex;align-items:center;gap:10px;font-size:16px;width:100%;justify-content:flex-start}
.title{display:flex;align-items:center;gap:18px}.lamp{width:62px;height:84px;flex:none;background:var(--lantern) center/contain no-repeat;image-rendering:pixelated;filter:drop-shadow(0 0 18px #ffb84acc);animation:flick 2.4s infinite alternate}@keyframes flick{50%{filter:drop-shadow(0 0 10px #ffb84a99)}}
.card.wide{grid-column:1/-1;min-height:76px}
/* игра */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:20px;align-items:stretch}
.q{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:400px}
.task{font-size:21px;line-height:1.2;margin-bottom:10px}
.big{font-size:170px;line-height:1.1}.mean{font-size:34px}
.recipe{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0}
.slot{width:128px;min-height:138px;background:#8b8b8b;border:4px solid #17110c;box-shadow:inset 4px 4px 0 #4a4a4a,inset -4px -4px 0 #d6d6d6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.slot .zh{font-size:72px;line-height:1.1;color:#fff;text-shadow:3px 3px 0 #333}
.slot .l{font-size:13px;color:#fff;text-shadow:1px 1px 0 #333;line-height:1.1;font-weight:400}
.slot.q1{background:#5a6bb0;animation:glow 1.2s infinite alternate}.slot.res{background:#3d6b2c}
@keyframes glow{to{box-shadow:inset 4px 4px 0 #3d4c8a,inset -4px -4px 0 #b9c4f5,0 0 18px #9fb2ff}}
.op{font-size:40px}
.side{display:flex;flex-direction:column;gap:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;flex:1}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts .btn{font-family:Verdana,sans-serif;font-size:21px;min-height:96px;line-height:1.1}
.opts .btn .zh{font-size:56px;line-height:1.1;display:block}.opts.three .btn .zh{font-size:46px}.opts.three .btn{min-height:84px}
.opts .btn span.s{font-size:15px;font-weight:400;display:block}
.fb{font-size:16px;font-weight:400;line-height:1.4;min-height:132px}.fb b{color:var(--gold)}.fb .zh{font-size:23px}
.row{display:flex;gap:12px;justify-content:flex-end}
.bar{height:20px;background:#17110c;border:3px solid #17110c;box-shadow:0 0 0 2px #6b4a2c}
.bar i{display:block;height:100%;background:linear-gradient(#8fe04a,#4f9e22);transition:width .25s}
.bar.fuse i{background:linear-gradient(#ffb03a,#e2432a);transition:width 1s linear}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* мемори */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,62vh,560px);margin:0 auto}
.mc{position:relative;aspect-ratio:1/1;font:inherit;cursor:pointer;color:var(--ink);border-style:solid;border-width:14px;border-image:var(--dirt) 26 28 fill/14px stretch;image-rendering:pixelated;background:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:1.1}
.mc.open,.mc.done{border-image-source:var(--parch);border-image-slice:58 60 fill}
.mc.done{filter:hue-rotate(40deg) saturate(1.4);opacity:.9}
.mc .zh{font-size:50px}
.mc:not(.open):not(.done)>*{visibility:hidden}

   $('.stat').innerHTML=`${hearts(hp,3)} ${ic('star','s')} ${score}`;$('#fb').innerHTML=msg+'<br>'+q.fb;$('#chk').hidden=true;$('#nx').hidden=false;$('#nx').focus()};

   $('#chk').onclick=()=>{let ok=true;bs.forEach((b,i)=>{const s=b.classList.contains('sel'),g=q.opts[i].ok;b.disabled=true;b.classList.remove('sel');
     if(g){b.classList.add('ok');if(!s){b.classList.add('miss');ok=false}}else if(s){b.classList.add('no');ok=false}});
    done(ok,ok?'✅ Всё добыто! +10 XP':'❌ Не всё: зелёные — правильные, пунктиром — пропущенные.')};return}
  bs.forEach(b=>b.onclick=()=>{const o=q.opts[+b.dataset.i];bs.forEach((x,i)=>{x.disabled=true;if(q.opts[i].ok)x.classList.add('ok')});
   if(!o.ok)b.classList.add('no');done(o.ok,o.ok?'✅ Верно! +10 XP':'❌ Мимо.')});}
 function end(){const win=hp>0;if(win)addXp(score*2);
  endScreen(win?(score>=9?'diam':'trophy'):'creeper',[win?(score>=9?'Алмазный результат!':'Уровень пройден!'):'Сердечки закончились.',`Верно: ${score} из ${N} · опыт: ${xp} XP`],()=>quiz(mode));}
 next();}

// ===== мемори на двоих =====
function mem(){stop();bg('fire');const keys=pick(KID,8);let cards=sh(keys.flatMap(k=>[{k,t:'k'},{k,t:'m'}])),open=[],lock=false,turn=0,sc=[0,0],msg='Открой две карточки: ключ и его значение. Нашёл пару — назови иероглиф с этим ключом и ходи ещё раз.';const names=['Миша','Учитель'];
 function draw(){app.innerHTML=`<div class="hud"><button class="btn sm w" id="back">◀ Меню</button><div class="sign">${ic('star','s')} Мемори на двоих</div><button class="btn sm" id="re">Заново</button></div>
  <div class="game"><div class="side">${names.map((n,i)=>`<div class="tx pl ${turn===i?'on':''}"><span>${turn===i?'▶ ':''}${n}</span><span>${sc[i]}</span></div>`).join('')}
  <div class="darkp fb" style="flex:1">${msg}</div></div>
  <div><div class="mem">${cards.map((c,i)=>`<button class="mc ${c.done?'done':''} ${open.includes(i)?'open':''}" data-i="${i}" aria-label="карточка ${i+1}">${c.t==='k'?`<span class="zh">${K[c.k][0]}</span>`:`<span>${K[c.k][3]}<br>${K[c.k][2]}</span>`}</button>`).join('')}</div></div></div>`;
  $('#back').onclick=menu;$('#re').onclick=mem;
  app.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(lock||cards[i].done||open.includes(i))return;open.push(i);
   if(open.length<2){draw();return}
   const[a,b2]=open,ok=cards[a].k===cards[b2].k&&cards[a].t!==cards[b2].t;
   if(ok){beep(1);const k=cards[a].k;cards[a].done=cards[b2].done=true;sc[turn]++;addXp(5);open=[];msg='✅ Пара! '+exLine(k);
    if(cards.every(c=>c.done))msg=`🏆 Игра окончена! ${sc[0]===sc[1]?'Ничья':'Победил: '+names[sc[0]>sc[1]?0:1]} (${sc[0]} : ${sc[1]})`;draw()}
   else{beep(0);lock=true;draw();setTimeout(()=>{open=[];lock=false;turn=1-turn;msg='Не пара. Ходит '+names[turn]+'.';draw()},1200)}});}
 draw();}

// ===== крипер-босс: 10 секунд на вопрос, 10 сердечек =====
function boss(){stop();bg('creep');const T=10;let t=T,hp=10,score=0,q,busy=false;
 function upd(){$('#hp').innerHTML=hearts(hp,10);$('#sc').innerHTML=`${ic('star','s')} ${score} · ⏱ ${Math.max(0,t)}`;$('#fuse').style.width=Math.max(0,t)/T*100+'%'}
 function hurt(m){hp-=2;beep(0);busy=true;$('.game').classList.remove('shake');void $('.game').offsetWidth;$('.game').classList.add('shake');
  app.querySelectorAll('.opts .btn').forEach((x,i)=>{x.disabled=true;if(q.opts[i].ok)x.classList.add('ok')});
  $('#msg').innerHTML=m+' −2 сердечка<br>'+q.fb;upd();setTimeout(()=>{busy=false;hp<=0?over():ask()},1800)}
 function ask(){q=(Math.random()<.5?qMine:qCraft)();t=T;$('#fuse').style.transition='none';
  $('#qa').innerHTML=`<div class="task">${q.task}</div>${q.html}`;
  $('#op').innerHTML=q.opts.map((o,i)=>`<button class="btn" data-i="${i}">${o.h}</button>`).join('');$('#msg').textContent='Успей за 10 секунд!';
  app.querySelectorAll('.opts .btn').forEach(b=>b.onclick=()=>{if(busy)return;const o=q.opts[+b.dataset.i];
   if(o.ok){score++;addXp(5);beep(1);ask()}else{b.classList.add('no');hurt('💥 Мимо!')}});upd();void $('#fuse').offsetWidth;$('#fuse').style.transition=''}
 function over(){stop();const best=store.get('misha_boss2',0);if(score>best)store.set('misha_boss2',score);
  endScreen('creeper',['Сердечки закончились — крипер взорвался.',`Ответов: ${score}${score>best?' — новый рекорд!':' · рекорд: '+best}`],boss)}
 app.innerHTML=`<div class="hud"><button class="btn sm w" id="back">◀ Меню</button><div class="stat" id="hp"></div><div class="stat" id="sc"></div></div>
 <div class="bar fuse"><i id="fuse" style="width:100%"></i></div>
 <div class="game"><div class="parch q" id="qa"></div><div class="side"><div class="opts" id="op"></div><div class="darkp fb" id="msg"></div></div></div>`;
 $('#back').onclick=menu;ask();
 timer=setInterval(()=>{if(busy)return;t--;upd();if(t<=0)hurt('⏱ Время вышло!')},1000);}
