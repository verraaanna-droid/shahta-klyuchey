<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>你是哪国人 · BOYA 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Golos+Text:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: a garden hub (painted banner + player panel + tiles of mini-games), each game opens as its own screen. Single daylight look, chosen on purpose. */
:root{
  color-scheme:light;
  --bg:#edf2e8; --paper:#fbf8ef; --paper-2:#f4efe0; --edge:#d9d2bd;
  --ink:#24302a; --muted:#5f6b63;
  --jade:#2f5d4e; --jade-2:#5f8f7b; --celadon:#cfe3d4; --mist:#e3eee5;
  --lotus:#b85a66; --lotus-2:#e9aab1; --lotus-mist:#f8e4e4;
  --gold:#a8823f; --gold-mist:#f1e6c9;
  --ok:#2f7d55; --ok-mist:#dcefe2; --bad:#b0414c; --bad-mist:#f7dfe1;
  --f-hz:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-head:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --paper-tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .05 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
.hz{font-family:var(--f-hz);font-weight:500}
.py{font-family:var(--f-ui);color:var(--jade-2);letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--lotus);outline-offset:2px}
.paper{background:var(--paper) var(--paper-tex);border:1px solid var(--edge);border-radius:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--jade);color:var(--jade);border-radius:999px;padding:9px 20px;font-weight:500;background:var(--paper)}
.btn:hover{background:var(--mist)}
.btn.solid{background:var(--jade);color:#fbf8ef}
.btn.solid:hover{background:#264e41}
.btn.lotus{border-color:var(--lotus);color:var(--lotus)}
.icon{width:20px;height:20px;flex:none}
[hidden]{display:none!important}

/* ===== hub ===== */
.lessons{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.lessons a{font-size:14px;font-weight:500;color:var(--jade);text-decoration:none;padding:6px 14px;border-radius:99px;border:1.5px solid var(--celadon);background:var(--paper)}
.lessons a:hover{border-color:var(--jade-2)}
.lessons a.on{background:var(--jade);border-color:var(--jade);color:#fbf8ef}
.clock{width:min(240px,60vw);height:auto;display:block;margin:6px auto 0}
.heard{margin-top:10px;font-size:15px}
.banner{position:relative;border-radius:24px;overflow:hidden;min-height:300px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end;gap:20px;padding:28px;border:1px solid var(--edge)}
.banner canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.banner>*:not(canvas){position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--lotus);font-weight:600}
.banner h1{margin:6px 0 0;font-family:var(--f-hz);font-weight:700;font-size:clamp(34px,5.4vw,58px);white-space:nowrap;line-height:1.05;color:var(--jade);letter-spacing:.03em}
.banner .ru-title{font-family:var(--f-head);font-size:clamp(20px,2.6vw,26px);font-weight:600;color:var(--ink);margin-top:6px}
.banner .py{font-size:15px;margin-top:2px}
.player{background:rgba(251,248,239,.88);backdrop-filter:blur(4px);border:1px solid var(--edge);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.player .who{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--jade);color:#fbf8ef;display:grid;place-items:center;font-family:var(--f-hz);font-size:22px;flex:none}
.player .name{font-family:var(--f-head);font-size:24px;font-weight:700;line-height:1.1}
.player .lvl{font-size:13px;color:var(--muted)}
.xpbar{height:8px;border-radius:99px;background:var(--mist);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade-2),var(--jade));border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--paper-2);border-radius:12px;padding:6px 4px}
.stats b{display:block;font-family:var(--f-ui);font-weight:600;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.player .links{display:flex;gap:12px;font-size:13px}
.player .links button{color:var(--jade);text-decoration:underline;text-underline-offset:3px}

.group{margin-top:34px}
.group-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.group-h h2{margin:0;font-family:var(--f-head);font-size:30px;font-weight:700}
.group-h .hz{color:var(--lotus);font-size:20px}
.group-h p{margin:0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{position:relative;text-align:left;display:flex;gap:14px;align-items:flex-start;padding:16px;transition:transform .2s,border-color .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--jade-2);box-shadow:0 10px 24px -14px rgba(47,93,78,.45)}
.seal{flex:none;width:56px;height:56px;border-radius:16px;background:var(--jade);color:#fbf8ef;display:grid;place-items:center;font-family:var(--f-hz);font-size:28px}
.tile.say .seal{background:var(--lotus)}
.tile.boss .seal{background:var(--gold)}
.tile h3{margin:2px 0 2px;padding-right:40px;font-family:var(--f-head);font-size:22px;font-weight:700;line-height:1.15}
.tile p{margin:0;font-size:13.5px;color:var(--muted)}
.stars{position:absolute;top:10px;right:12px;font-size:14px;letter-spacing:1px;color:var(--gold)}

/* ===== game screen ===== */
.game{max-width:900px;margin:0 auto;border-radius:24px;border:1px solid var(--edge);padding:20px 20px 28px;background-color:var(--mist);background-size:cover;background-position:center bottom}
.game .ghead h2{text-shadow:0 1px 0 rgba(251,248,239,.8)}
.game .ghead .meta{background:rgba(251,248,239,.85);padding:4px 12px;border-radius:99px}
.game .stage{box-shadow:0 18px 40px -26px rgba(36,48,42,.5)}
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ghead h2{margin:0;font-family:var(--f-head);font-size:30px;font-weight:700;flex:1;min-width:0}
.ghead .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.dots i{width:22px;height:6px;border-radius:9px;background:var(--celadon)}
.dots i.ok{background:var(--jade)}.dots i.bad{background:var(--lotus-2)}.dots i.now{background:var(--gold)}
.stage{padding:28px 22px;text-align:center}
.task{font-size:15px;color:var(--muted);margin-bottom:10px}
.prompt-hz{font-family:var(--f-hz);font-size:clamp(64px,13vw,104px);line-height:1.15;color:var(--ink)}
.prompt-py{font-size:20px;margin-top:2px}
.prompt-ru{font-family:var(--f-head);font-size:clamp(26px,4vw,34px);font-weight:700;line-height:1.2}
.listen{width:96px;height:96px;border-radius:50%;background:var(--jade);color:#fbf8ef;display:inline-grid;place-items:center;margin:8px auto}
.listen .icon{width:40px;height:40px}
.listen:hover{background:#264e41}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.opt{padding:16px 12px;border-radius:14px;border:1.5px solid var(--edge);background:var(--paper);transition:.15s;min-height:72px}
.opt:hover{border-color:var(--jade-2)}
.opt .hz{font-size:34px;line-height:1.2;display:block}
.opt .py{font-size:14px}
.opt.txt{font-size:18px}
.opt.ok{border-color:var(--ok);background:var(--ok-mist);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-mist);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{min-height:28px;margin-top:16px;font-weight:500}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.under{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* tiles to build */
.answer{min-height:78px;border:2px dashed var(--jade-2);border-radius:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;margin-top:18px;background:var(--paper-2)}
.answer.ok{border-style:solid;border-color:var(--ok);background:var(--ok-mist)}
.answer.bad{border-style:solid;border-color:var(--bad);background:var(--bad-mist)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px;min-height:62px}
.chip{font-family:var(--f-hz);font-size:30px;padding:6px 16px;border-radius:12px;background:var(--paper);border:1.5px solid var(--jade);color:var(--jade);box-shadow:0 2px 0 var(--celadon)}
.chip:hover{background:var(--mist)}
.chip.used{visibility:hidden}

.chip{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.dragging{opacity:.3}
.ghost{position:fixed;pointer-events:none;z-index:60;margin:0;transform:rotate(-3deg) scale(1.06);box-shadow:0 14px 28px -10px rgba(36,48,42,.45);cursor:grabbing}
.answer.hot,.bank.hot{outline:3px dashed var(--lotus);outline-offset:3px}
.slot.hot{border-color:var(--lotus);background:var(--lotus-mist)}
.answer .hint{color:var(--muted);font-size:15px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.mcard{aspect-ratio:3/4;border-radius:14px;position:relative;perspective:600px}
.mcard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:grid;place-items:center;padding:6px;text-align:center}
.mcard .f{background:var(--jade);color:var(--celadon);font-family:var(--f-hz);font-size:28px}
.mcard .b{background:var(--paper);border:1.5px solid var(--edge);transform:rotateY(180deg)}
.mcard .b .hz{font-size:30px}
.mcard .b .ru{font-size:14px}
.mcard.done .b{border-color:var(--ok);background:var(--ok-mist)}

/* writing */
.wbox{width:min(300px,78vw);height:min(300px,78vw);margin:14px auto 0;position:relative;background:var(--paper-2);border:2px solid var(--jade-2);border-radius:6px}
.wbox::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--celadon),var(--celadon)) center/100% 1.5px no-repeat,linear-gradient(var(--celadon),var(--celadon)) center/1.5px 100% no-repeat;pointer-events:none}
.wbox>div{position:relative}
.chars{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.chars button{font-family:var(--f-hz);font-size:24px;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--edge);background:var(--paper)}
.chars button.on{border-color:var(--jade);background:var(--jade);color:#fbf8ef}
.chars button.done{border-color:var(--ok);color:var(--ok)}

/* map */
.mapg{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,minmax(78px,auto));gap:8px;background:var(--mist);border-radius:16px;padding:12px;margin-top:10px}
.mapg .c{display:grid;place-items:center;font-family:var(--f-hz);color:var(--jade-2)}
.mapg .center{background:var(--jade);color:#fbf8ef;border-radius:12px;width:100%;height:100%;display:grid;place-items:center;font-size:20px}
.slot{width:100%;height:100%;min-height:70px;border:2px dashed var(--jade-2);border-radius:12px;display:grid;place-items:center;background:var(--paper);font-family:var(--f-hz);font-size:20px}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-mist);color:var(--ok)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-mist);color:var(--bad)}
.clues{display:grid;gap:8px;margin-top:14px;text-align:left}
.clue{padding:10px 14px;border-radius:12px;background:var(--paper-2);display:flex;gap:10px;align-items:center}
.clue .hz{font-size:21px;display:block}
.clue .py{font-size:13px}
.chip.sel{background:var(--jade);color:#fbf8ef}

/* dialogue & speaking */
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tabs .btn{padding:6px 14px;font-size:14px}
.lines{display:grid;gap:10px;text-align:left}
.line{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--edge)}
.line.me{background:var(--mist);border-color:var(--celadon)}
.line .who{flex:none;width:74px;font-size:12px;color:var(--muted);padding-top:8px}
.line .t{flex:1;min-width:0}
.line .hz{font-size:clamp(22px,3vw,27px);line-height:1.45;display:block}
.line .py{font-size:14px;display:block}
.line .ru{font-size:13px;color:var(--muted)}
.line.me.hid .hz,.line.me.hid .py{filter:blur(8px)}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--celadon);background:var(--paper);display:grid;place-items:center;color:var(--jade);flex:none}
.round .icon{width:18px;height:18px}
.sample{margin-top:16px;padding:14px;border-radius:14px;background:var(--paper-2)}
.sample .hz{font-size:30px;display:block}

/* boss */
.hearts{font-size:22px;letter-spacing:3px;color:var(--lotus)}
.timer{height:8px;border-radius:9px;background:var(--mist);overflow:hidden;margin:10px 0 0}
.timer i{display:block;height:100%;background:var(--gold);width:100%}

/* book */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;text-align:left}
.bw{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--edge)}
.bw .hz{font-size:30px;line-height:1.1}
.bw .py{font-size:13px;display:block}
.bw .ru{font-size:13px;color:var(--muted);display:block}
.bw.hard{border-color:var(--lotus-2);background:var(--lotus-mist)}

/* summary + modal */
.result .big{font-family:var(--f-head);font-size:44px;font-weight:700;margin:6px 0}
.result .st{font-size:36px;color:var(--gold);letter-spacing:6px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(36,48,42,.45);display:grid;place-items:center;padding:20px}
.modal .box{max-width:420px;width:100%;padding:28px;text-align:center}
.modal input{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--edge);background:#fff;text-align:center;margin:14px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--jade);color:#fbf8ef;padding:10px 18px;border-radius:99px;z-index:50;font-weight:500;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}

@media (max-width:760px){
  .banner{grid-template-columns:1fr;padding:20px;min-height:0}
  .opts{grid-template-columns:1fr 1fr}
  .stage{padding:20px 14px}
  .mem{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:520px){.ghead .meta{order:3;margin-left:auto}.ghead h2{flex-basis:calc(100% - 140px)}}
@media (max-width:420px){.opts{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>

<div class="wrap">
  <main id="hub">
    <nav class="lessons" id="lessonNav" aria-label="Уроки"></nav>
    <header class="banner">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div>
        <div class="eyebrow" id="cEyebrow"></div>
        <h1 id="cTitle"></h1>
        <div class="py" id="cPy"></div>
        <div class="ru-title" id="cRu"></div>
      </div>
      <aside class="player" aria-label="Игрок">
        <div class="who"><div class="avatar" id="pAva">学</div><div><div class="name" id="pName">Гость</div><div class="lvl" id="pLvl">Уровень 1</div></div></div>
        <div class="xpbar" aria-hidden="true"><i id="pXp" style="width:0%"></i></div>
        <div class="stats">
          <div><b id="sXp">0</b><span>опыт</span></div>
          <div><b id="sHard">0</b><span>трудных слов</span></div>
          <div><b id="sBoss">0</b><span>рекорд стража</span></div>
        </div>
        <div class="links"><button type="button" id="chName">Сменить игрока</button><button type="button" id="resetAll">Сбросить прогресс</button></div>
      </aside>
    </header>

    <section class="group">
      <div class="group-h"><h2>Слова</h2><span class="hz">词语</span><p id="cWordsSub"></p></div>
      <div class="tiles" id="gWords"></div>
    </section>
    <section class="group">
      <div class="group-h"><h2>Фразы</h2><span class="hz">句子</span><p id="cSentSub"></p></div>
      <div class="tiles" id="gSent"></div>
    </section>
    <section class="group">
      <div class="group-h"><h2>Говорим</h2><span class="hz">说话</span><p>вслух, вместе с учителем</p></div>
      <div class="tiles" id="gSay"></div>
    </section>
    <section class="group">
      <div class="group-h"><h2>Финал</h2><span class="hz">挑战</span><p>проверь себя</p></div>
      <div class="tiles" id="gFinal"></div>
    </section>
  </main>

  <main id="screen" class="game" hidden>
    <div class="ghead">
      <button class="btn" type="button" id="back"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Меню</button>
      <h2 id="gTitle">Игра</h2>
      <div class="meta" id="gMeta"></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="stage paper" id="stage"></div>
  </main>
</div>

<div class="modal" id="nameModal" hidden>
  <form class="box paper" id="nameForm">
    <div class="seal" style="margin:0 auto">你</div>
    <h2 style="font-family:var(--f-head);font-size:30px;margin:12px 0 0">Как тебя зовут?</h2>
    <p style="color:var(--muted);margin:6px 0 0">Прогресс сохранится под этим именем на этом устройстве.</p>
    <input id="nameInput" maxlength="24" placeholder="Имя" autocomplete="off">
    <button class="btn solid" type="submit">Начать</button>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
window.LESSON = {
  key: 'boya2', pageTitle: '你是哪国人 · BOYA 2',

const player = new Audio();
function speak(t, onend) {
  try { speechSynthesis.cancel(); } catch (e) {}
  player.onended = null; player.pause();
  if (AUDIO[t]) { player.src = AUDIO[t]; player.currentTime = 0; player.onended = () => { onend && onend(); }; player.play().catch(() => { onend && onend(); }); return; }
  ttsFallback(t, onend);
}
function ttsFallback(t, onend) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice; u.rate = .8; if (onend) u.onend = onend; speechSynthesis.speak(u); } catch (e) { onend && onend(); } }

const C = window.LESSON;
const MARKS = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù' };
function mark(s, t) {
  if (!t) return s;
  let i = s.search(/[ae]/i); if (i < 0) i = s.toLowerCase().indexOf('ou');
  if (i < 0) for (let k = s.length - 1; k >= 0; k--) if ('aeiou'.includes(s[k].toLowerCase())) { i = k; break; }
  const ch = s[i], lo = ch.toLowerCase(); let m = MARKS[lo][t - 1]; if (ch !== lo) m = m.toUpperCase();
  return s.slice(0, i) + m + s.slice(i + 1);
}
const pyOf = syl => syl.map(([b, t]) => mark(b, t)).join('');
const W = C.WORDS.map(w => Array.isArray(w[1]) ? { h: w[0], syl: w[1], py: pyOf(w[1]), ru: w[2] } : { h: w[0], syl: null, py: w[1], ru: w[2] });
const byH = Object.fromEntries(W.map(w => [w.h, w]));
const isHan = c => /\p{Script=Han}/u.test(c);
const hanOnly = s => [...(s || '')].filter(isHan).join('');
const sFull = s => s.full || s.zh.join('') + s.end;
const { SENTS, GAPS, DIALOGS, ASK } = C;
const WRITE = C.WRITE || [], WRITE_INFO = C.WRITE_INFO || {};

function numZh(n) { const d = '零一二三四五六七八九'; if (n === 100) return '一百'; if (n <= 10) return n === 10 ? '十' : d[n]; if (n < 20) return '十' + (n % 10 ? d[n % 10] : ''); return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : ''); }
const hourZh = h => h === 2 ? '两' : numZh(h);
function timeZh(h, m) { const nh = h % 12 + 1; switch (m) { case 0: return hourZh(h) + '点'; case 15: return hourZh(h) + '点一刻'; case 30: return hourZh(h) + '点半'; case 45: return '差一刻' + hourZh(nh) + '点'; case 50: return '差十分' + hourZh(nh) + '点'; case 55: return '差五分' + hourZh(nh) + '点'; case 5: return hourZh(h) + '点零五分'; default: return hourZh(h) + '点' + numZh(m) + '分'; } }

let P = null;
const KEY = C.key + '_players', LAST = 'boya_last';
function loadPlayer(name) { const all = store.get(KEY, {}); P = all[name] || { name, xp: 0, best: 0, hard: [], stars: {} }; P.name = name; store.set(LAST, name); save(); }
function save() { if (!P) return; const all = store.get(KEY, {}); all[P.name] = P; store.set(KEY, all); drawPlayer(); }
function addXp(n) { const before = Math.floor(P.xp / 100); P.xp += n; if (Math.floor(P.xp / 100) > before) toast('Новый уровень: ' + (Math.floor(P.xp / 100) + 1)); save(); }
function hardAdd(h) { if (byH[h] && !P.hard.includes(h)) { P.hard.push(h); save(); } }
function hardOk(h) { const i = P.hard.indexOf(h); if (i >= 0 && Math.random() < .5) { P.hard.splice(i, 1); save(); } }
function drawPlayer() {
  if (!P) return;
  $('#pName').textContent = P.name; $('#pAva').textContent = P.name.trim()[0] ? P.name.trim()[0].toUpperCase() : '学';
  $('#pLvl').textContent = 'Уровень ' + (Math.floor(P.xp / 100) + 1) + ' · до следующего ' + (100 - P.xp % 100) + ' опыта';

  $('#sXp').textContent = P.xp; $('#sHard').textContent = P.hard.length; $('#sBoss').textContent = P.best;
  document.querySelectorAll('.tile[data-g]').forEach(t => { const s = P.stars[t.dataset.g] || 0; t.querySelector('.stars').textContent = '★'.repeat(s) + '☆'.repeat(3 - s); });
}

/* ===== drag & drop ===== */
function dragify(chip, opt) {

    const sx = e.clientX, sy = e.clientY, zs = opt.zones(); let ghost = null, moved = false, over = null;
    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      if (!moved) { moved = true; ghost = chip.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel'); const r = chip.getBoundingClientRect(); ghost.style.width = r.width + 'px'; document.body.appendChild(ghost); chip.classList.add('dragging'); }
      ghost.style.left = ev.clientX - ghost.offsetWidth / 2 + 'px'; ghost.style.top = ev.clientY - ghost.offsetHeight / 2 + 'px';
      const hit = document.elementFromPoint(ev.clientX, ev.clientY); const z = (hit && zs.find(z => z.contains(hit))) || null;
      if (z !== over) { if (over) over.classList.remove('hot'); over = z; if (over) over.classList.add('hot'); }
    };
    const up = ev => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (over) over.classList.remove('hot');
      if (!moved) { if (opt.onTap) opt.onTap(); return; }
      ghost.remove(); chip.classList.remove('dragging'); opt.onDrop(over, ev.clientX, ev.clientY);
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });

}
function assembler(st, tokens, need, onFull) {

  const zones = () => [ans, bank];

    const c = el('button', 'chip', tokens[id]); c.type = 'button'; c.dataset.id = id;
    const tap = () => { if (locked) return; if (inAns) seq = seq.filter(v => v !== id); else if (seq.length < need) seq.push(id); changed(); };
    dragify(c, { zones, onTap: tap, onDrop: (z, x, y) => {
      if (locked) return;

        const kids = [...ans.querySelectorAll('.chip')].filter(k => +k.dataset.id !== id);
        if (!inAns && seq.length >= need) { changed(); return; }
        let idx = kids.findIndex(k => { const r = k.getBoundingClientRect(); return y < r.top || (y <= r.bottom && x < r.left + r.width / 2); });
        if (idx < 0) idx = kids.length;
        seq = kids.map(k => +k.dataset.id); seq.splice(idx, 0, id);

    seq.forEach(id => ans.appendChild(chip(id, true)));
    tokens.forEach((t, id) => { if (!seq.includes(id)) bank.appendChild(chip(id, false)); });
  }

/* ===== speech check ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const MIC = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';

function similarity(heard, target) {
  const a = normZh(heard), b = normZh(target); if (!a || !b) return 0;
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const l = dp[a.length][b.length]; return (2 * l) / (a.length + b.length);
}
function micButton(target, out) {

  const b = el('button', 'btn lotus', label); b.type = 'button';
  b.onclick = () => {
    let r; try { r = new SR(); } catch (e) { return; }
    r.lang = 'zh-CN'; r.maxAlternatives = 5; r.interimResults = false;
    b.disabled = true; b.innerHTML = MIC + 'Слушаю…'; out.className = 'fb heard'; out.textContent = 'Говори!';
    r.onresult = e => {
      const alts = [...e.results[0]].map(x => x.transcript); let best = alts[0] || '', bs = 0;
      alts.forEach(t => { const v = similarity(t, target); if (v > bs) { bs = v; best = t; } });
      const pct = Math.round(bs * 100);
      out.className = 'fb heard ' + (pct >= 80 ? 'ok' : 'bad');
      out.textContent = `Распознано: ${best} · совпадение ${pct}%. ` + (pct >= 80 ? 'Отлично!' : pct >= 50 ? 'Почти, повтори ещё раз.' : 'Попробуй ещё раз, медленнее.');
      if (pct >= 80) addXp(5);

    r.onerror = e => { out.className = 'fb heard bad'; out.textContent = e.error === 'not-allowed' ? 'Браузер не дал доступ к микрофону. Разреши микрофон для этой страницы.' : 'Не расслышал. Попробуй ещё раз.'; };
    r.onend = () => { b.disabled = false; b.innerHTML = label; };
    try { r.start(); } catch (e) { b.disabled = false; b.innerHTML = label; }

}

}

function clockSvg(h, m) {
  const ang = (v, max) => (v / max) * 2 * Math.PI - Math.PI / 2;
  const ha = ang((h % 12) + m / 60, 12), ma = ang(m, 60);
  let ticks = ''; for (let k = 0; k < 60; k += 5) { const a = ang(k, 60), r1 = k % 15 ? 86 : 80; ticks += `<line x1="${100 + Math.cos(a) * r1}" y1="${100 + Math.sin(a) * r1}" x2="${100 + Math.cos(a) * 92}" y2="${100 + Math.sin(a) * 92}" stroke="#2f5d4e" stroke-width="${k % 15 ? 2 : 4}" stroke-linecap="round"/>`; }
  const nums = [[12, 0], [3, 15], [6, 30], [9, 45]].map(([n, k]) => { const a = ang(k, 60); return `<text x="${100 + Math.cos(a) * 66}" y="${100 + Math.sin(a) * 66 + 7}" text-anchor="middle" font-size="20" font-family="Georgia" fill="#2f5d4e">${n}</text>`; }).join('');
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Часы"><circle cx="100" cy="100" r="96" fill="#fbf8ef" stroke="#2f5d4e" stroke-width="5"/>${ticks}${nums}<line x1="100" y1="100" x2="${100 + Math.cos(ha) * 46}" y2="${100 + Math.sin(ha) * 46}" stroke="#24302a" stroke-width="7" stroke-linecap="round"/><line x1="100" y1="100" x2="${100 + Math.cos(ma) * 74}" y2="${100 + Math.sin(ma) * 74}" stroke="#b85a66" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#24302a"/></svg>`;
}
function clockGame() {
  const qs = []; const seen = new Set();
  while (qs.length < 8) { const h = pick(CLOCK_H, 1)[0], m = pick(CLOCK_M, 1)[0], k = h + ':' + m; if (seen.has(k)) continue; seen.add(k);
    const ans = timeZh(h, m); const opts = new Set([ans]); let g = 0;
    while (opts.size < 4 && g++ < 50) { const hh = Math.random() < .5 ? h : pick(CLOCK_H, 1)[0], mm = Math.random() < .6 ? pick(CLOCK_M, 1)[0] : m; opts.add(timeZh(hh, mm)); }
    const hm = `${h}:${String(m).padStart(2, '0')}`;
    qs.push({ kind: 'gap', w: { h: ans, py: '', ru: '' }, ans, full: `${ans} · ${hm}`, task: 'Который час? Выбери, как это сказать по-китайски', prompt: clockSvg(h, m), opts: shuffle([...opts]).map(v => ({ v, html: `<span class="hz" style="font-size:28px">${v}</span>` })) });
  }

}
function numbersGame() {
  const pool = [89, 12, 35, 67, 98, 49, 51, 100, 24, 73, 56, 80, ...Array.from({ length: 12 }, () => 11 + Math.floor(Math.random() * 89))];
  const nums = pick([...new Set(pool)], 10);

    return { kind: 'gap', w: { h: ans, py: '', ru: '' }, ans, full: `${n} = ${ans}`, task: 'Как это число по-китайски?', prompt: `<div class="prompt-ru" style="font-size:72px">${n}</div>`, opts: shuffle([...opts]).map(v => ({ v, html: `<span class="hz" style="font-size:28px">${v}</span>` })) }; });

}

/* ===== painted banner ===== */
const scene = (() => {

    petals = Array.from({ length: Math.round(w / 40) }, () => ({ x: Math.random() * w, y: Math.random() * h, s: 3 + Math.random() * 4, v: .2 + Math.random() * .4, a: Math.random() * 6, p: Math.random() < .6 })); }

    const sx = w * .74, sy = h * .32; const sg = x.createRadialGradient(sx, sy, 4, sx, sy, h * .45); sg.addColorStop(0, 'rgba(255,250,232,.95)'); sg.addColorStop(.35, 'rgba(255,248,226,.55)'); sg.addColorStop(1, 'rgba(255,248,226,0)'); x.fillStyle = sg; x.fillRect(0, 0, w, h);
    ridge(h * .62, h * .12, 1.3, 'rgba(143,183,164,.35)'); ridge(h * .72, h * .1, 3.1, 'rgba(111,159,138,.42)'); ridge(h * .84, h * .07, 5.2, 'rgba(79,127,108,.5)');
    x.fillStyle = 'rgba(47,93,78,.14)'; for (let i = 0; i < 7; i++) { const lx = w * (.08 + i * .14) + Math.sin(i * 3) * 20, ly = h * .95 + (i % 2) * 6; x.beginPath(); x.ellipse(lx, ly, 34, 10, 0, 0, Math.PI * 2); x.fill(); }

      for (let k = 1; k < 9; k++) { const q = k / 9, lx = bx + (18 + sway) * 2 * q * (1 - q) + (10 + sway * 1.6) * q * q, ly = len * q; x.fillStyle = 'rgba(111,159,138,.55)'; x.beginPath(); x.ellipse(lx + (k % 2 ? 5 : -5), ly, 6, 2.2, k % 2 ? .6 : -.6, 0, Math.PI * 2); x.fill(); } }

  }
